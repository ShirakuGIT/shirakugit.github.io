# Pages shown in navbar
nav_pages:
  - name: about
  - name: projects
  - name: research
  - name: blogs
  - name: notes
  - name: photography

# Collections — personal notes garden
collections:
  notes:
    output: true
    permalink: /notes/:path/

# Default front matter values
defaults:
  - scope:
      path: ""
    values:
      image: /images/headshot.jpg
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      category: misc
      excerpt_separator: ""

include:
  - .htaccess
  - .nojekyll
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins:
  - jekyll/scholar
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

scholar:
  last_name: Doe
  first_name: [John]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - images/photography-originals
  - scripts
