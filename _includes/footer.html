{%- assign _me = site.data.pi[0] -%}
<footer class="site-footer">
<div class="wrap">
  <p><a href="#" onclick="return emailDecode(this);" data-email="{{ site.email }}">Email</a> · <a href="{{ _me.cv | prepend: '/' | relative_url }}">CV</a> · <a href="{{ _me.scholar }}">Scholar</a> · <a href="{{ _me.github }}">GitHub</a> · <a href="{{ _me.linkedin }}">LinkedIn</a> · <a href="{{ _me.twitter }}">X</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  <p class="modified">&copy; {{ "now" | date: "%Y" }} {{ _me.name }} · updated {{ page.last_modified_at | default: page.updated | default: site.time | date: "%b %-d, %Y" }}</p>
</div>
</footer>

<script>
  // Email links carry "name [at] host [dot] tld" so scrapers miss them; decode on click.
  function emailDecode(el) {
    var e = el.getAttribute("data-email")
      .replace(/\s*\[at\]\s*/g, "@")
      .replace(/\s*\[dot\]\s*/g, ".");
    window.location.href = "mailto:" + e;
    return false;
  }
</script>
