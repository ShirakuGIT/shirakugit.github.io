<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include theme.html %}

  {% if page.noindex %}
  <meta name="robots" content="noindex, follow">
  {% else %}
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  {% endif %}

  <!-- SEO: meta, Open Graph, Twitter cards, JSON-LD (jekyll-seo-tag) -->
  {% seo %}
  <!-- Reinforce the headshot as the share/preview image across engines -->
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="Shivaram Kumar Jagannathan">
  <meta name="twitter:image:alt" content="Shivaram Kumar Jagannathan">
  <!-- RSS feed discovery (jekyll-feed) -->
  {% feed_meta %}

  <link rel="preload" href="{{ '/assets/fonts/LM8-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/assets/site.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ site.url }}{{ site.baseurl }}/images/favicon-96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="{{ site.url }}{{ site.baseurl }}/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.url }}{{ site.baseurl }}/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.url }}{{ site.baseurl }}/images/favicon-16.png">
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.url }}{{ site.baseurl }}/images/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">

  <!-- Person structured data for richer search / AI entity understanding -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Shivaram Kumar Jagannathan",
    "givenName": "Shivaram",
    "additionalName": "Kumar",
    "familyName": "Jagannathan",
    "alternateName": [
      "Shivaram",
      "Shivaram Kumar",
      "Shivaram K",
      "Shivaram K Jagannathan",
      "Shivaram Kumar J",
      "Shivaram Jagannathan",
      "S. K. Jagannathan",
      "Shiraku"
    ],
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "mainEntityOfPage": "{{ site.url }}{{ site.baseurl }}/",
    "image": "{{ site.url }}{{ site.baseurl }}/images/headshot.jpg",
    "jobTitle": "Robotics Researcher",
    "description": "Shivaram — robotics researcher at NTU Singapore. Also goes by Shivaram Kumar, Shivaram K, Shivaram Kumar Jagannathan.",
    "affiliation": [
      { "@type": "Organization", "name": "Nanyang Technological University" },
      { "@type": "CollegeOrUniversity", "name": "Manipal Institute of Technology" }
    ],
    "knowsAbout": ["Robotics", "Spatial Intelligence", "Task and Motion Planning", "SLAM", "Sensor Fusion", "Machine Learning", "Computer Vision", "3D Reconstruction"],
    "sameAs": [
      "https://scholar.google.com/citations?user=geKWO64AAAAJ&hl=en",
      "https://github.com/ShirakuGIT",
      "https://www.linkedin.com/in/shivaramkumarj/",
      "https://x.com/shirakuex"
    ]
  }
  </script>

  <!-- WebSite schema to claim sitelinks-search-box + canonical site name -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "name": "Shivaram",
    "alternateName": ["Shivaram Kumar Jagannathan", "Shivaram Kumar", "Shivaram K Jagannathan"],
    "author": { "@type": "Person", "name": "Shivaram Kumar Jagannathan" }
  }
  </script>
  <!-- No icon fonts or web-font services: the homepage style is text-only (AGENTS.md §7.0).
       Latin Modern is self-hosted in assets/fonts/. Calendly is a plain link (social.html). -->

  <link rel="preconnect" href="https://player.vimeo.com">
  <link rel="preconnect" href="https://i.vimeocdn.com">
  <link rel="preconnect" href="https://f.vimeocdn.com">


{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

{% include mathjax.html %}

</head>
