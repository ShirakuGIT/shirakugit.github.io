{%- comment -%}
  Responsive image with optional caption.
  Usage: {% include figure.html src="/images/foo.jpg" alt="..." caption="A caption" width="80%" %}
  Output is a single physical line so kramdown passes the <figure> through verbatim.
{%- endcomment -%}
{%- assign src = include.src -%}{%- unless src contains "://" -%}{%- assign src = src | prepend: site.baseurl | prepend: site.url -%}{%- endunless -%}
{::nomarkdown}<figure class="post-figure"{% if include.width %} style="max-width: {{ include.width }}"{% endif %}><img src="{{ src }}" alt="{{ include.alt | default: include.caption }}" loading="lazy" />{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>{:/nomarkdown}
