<div class="visitor-map">
  <p class="visitor-label">Visitors</p>
  <p class="visitor-total" id="visitor-total"></p>
  <div class="visitor-frame">
    <div id="worldmap"></div>
  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.min.js"></script>
<script>
(function(){
  var el = document.getElementById('worldmap');
  if(!el || typeof jsVectorMap === 'undefined') return;
  var dataUrl = '{{ "/assets/visits.json" | relative_url }}';

  fetch(dataUrl).then(function(r){ return r.json(); }).then(function(json){
    var counts = (json && json.counts) || {};
    var total = 0, codes = Object.keys(counts);
    codes.forEach(function(c){ total += counts[c]; });

    var totalEl = document.getElementById('visitor-total');
    if(totalEl){
      totalEl.textContent = total.toLocaleString() + ' visits · ' + codes.length + ' countries';
    }

    // Compute an explicit green shade per visitor country (dark -> bright = fewer -> more).
    // We map colors ourselves instead of jsVectorMap's `scale`/`series` engine, which
    // rendered regions black here. Passing hex strings as `values` sets fill directly.
    var GLO = [0x4d, 0x5d, 0x33];   // dark olive-green (few visits)
    var GHI = [0xaf, 0xc1, 0x78];   // bright sage-green (most visits)
    var max = 0;
    codes.forEach(function(c){ if(counts[c] > max) max = counts[c]; });
    function hex(n){ n = Math.max(0, Math.min(255, n)); return (n < 16 ? '0' : '') + n.toString(16); }
    function greenFor(count){
      // floor at 0.4 so even the smallest visitor country reads clearly green, not near-black
      var t = max > 0 ? count / max : 1;
      t = 0.4 + 0.6 * t;
      var r = Math.round(GLO[0] + (GHI[0] - GLO[0]) * t);
      var g = Math.round(GLO[1] + (GHI[1] - GLO[1]) * t);
      var b = Math.round(GLO[2] + (GHI[2] - GLO[2]) * t);
      return '#' + hex(r) + hex(g) + hex(b);
    }
    var BASE = '#403a31';   // empty-country dot colour

    var map = new jsVectorMap({
      selector: '#worldmap',
      map: 'world',
      zoomButtons: false,        // no +/- tool icons
      zoomOnScroll: true,        // scroll to zoom
      zoomOnScrollSpeed: 0.6,    // gentler than default — less aggressive
      zoomStep: 1.3,
      zoomMax: 8,
      zoomMin: 1,
      // dragging the map pans it (built in) — gives "zoom + pan, no chrome"
      backgroundColor: 'transparent',
      // no borders — the dot matrix carries the shapes
      regionStyle: {
        initial:  { fill: '#403a31', stroke: 'none', fillOpacity: 1 },
        hover:    { fillOpacity: 1, fill: '#e89a5c' }
      },
      onRegionTooltipShow: function(event, tooltip, code){
        var n = counts[code] || 0;
        var name = tooltip.text();
        if(n > 0){
          tooltip.text(name + ' — ' + n.toLocaleString() + (n === 1 ? ' visit' : ' visits'), true);
        } else {
          tooltip.text(name + ' — no visits yet', true);
        }
      }
    });

    // --- Dot-matrix render -------------------------------------------------
    // Give every region a fill made of small dots (green for visitor countries,
    // faint base colour otherwise). Colour is keyed off each path's data-code,
    // so we don't depend on jsVectorMap's series engine (which didn't paint here)
    // or on getComputedStyle (empty before first layout). Patterns live in the
    // map's user space, so the dots scale/pan with the map on zoom.
    var NS = 'http://www.w3.org/2000/svg';
    function paintDots(){
      var svg = el.querySelector('svg');
      var paths = svg && svg.querySelectorAll('path[data-code]');
      if (!paths || !paths.length){ return requestAnimationFrame(paintDots); }

      var defs = svg.querySelector('defs');
      if (!defs){ defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }

      var patCache = {};
      function patternFor(color){
        if (patCache[color]) return patCache[color];
        var id = 'dot-' + color.replace(/[^a-z0-9]/gi, '');
        var p = document.createElementNS(NS, 'pattern');
        p.setAttribute('id', id);
        p.setAttribute('patternUnits', 'userSpaceOnUse');
        p.setAttribute('width', '6'); p.setAttribute('height', '6');
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', '3'); c.setAttribute('cy', '3'); c.setAttribute('r', '1.5');
        c.setAttribute('fill', color);
        p.appendChild(c); defs.appendChild(p);
        patCache[color] = id;
        return id;
      }

      // Orange dot pattern used for the hover highlight (keeps the matrix look).
      var hoverFill = 'url(#' + patternFor('#e89a5c') + ')';

      Array.prototype.forEach.call(paths, function(pth){
        var code = pth.getAttribute('data-code');
        var color = (counts[code] > 0) ? greenFor(counts[code]) : BASE;
        var restFill = 'url(#' + patternFor(color) + ')';

        // Drive fill via INLINE STYLE. jsVectorMap manages fill through the SVG
        // `fill` attribute (and restores a solid colour on mouseout). Inline style
        // always beats a presentation attribute, so our dotted fill is never wiped
        // — regardless of jsVectorMap's event handling. We own hover the same way.
        pth.style.fill = restFill;
        pth.addEventListener('mouseenter', function(){ pth.style.fill = hoverFill; });
        pth.addEventListener('mouseleave', function(){ pth.style.fill = restFill; });
      });
    }
    requestAnimationFrame(paintDots);
  }).catch(function(){ /* map stays empty if data unavailable */ });
})();
</script>
