{%- comment -%}
  Site header bar (Karpathy-style): dark top rule, one row of links, home first.
{%- endcomment -%}
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header class="site-header">
  <div class="wrap">
    <nav class="site-nav" aria-label="Site">
    <a class="page-link" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>home</a>
    {%- for p in site.nav_pages -%}
      {%- assign _url = '/' | append: p.name | append: '/' -%}
      <a class="page-link" href="{{ _url | relative_url }}"{% if page.url == _url %} aria-current="page"{% endif %}>{{ p.name }}</a>
    {%- endfor -%}
    <button type="button" class="theme-toggle" id="theme-toggle" hidden aria-label="Switch colour theme"></button>
    <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme-toggle");
      function label() {
        var dark = root.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "\u2600" : "\u263E";   /* ☀ in dark mode, ☾ in light mode */
        btn.title = btn.ariaLabel = dark ? "Switch to light mode" : "Switch to dark mode";
      }
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      label();
      btn.hidden = false;
    })();
    </script>
    {% include search.html %}
    </nav>
  </div>
</header>
